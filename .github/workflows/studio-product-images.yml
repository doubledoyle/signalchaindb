name: Generate dark studio product images
on:
  push:
    branches: [feature/dark-studio-images]
    paths:
      - scripts/studio-product-images.py
      - .github/workflows/studio-product-images.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install pillow requests
      - name: Generate studio images
        run: python scripts/studio-product-images.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/product-images.ts public/products/studio
          git diff --cached --quiet || git commit -m "Generate dark studio product images"
          git push
