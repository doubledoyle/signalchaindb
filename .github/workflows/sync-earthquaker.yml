name: Sync EarthQuaker research
on:
  workflow_dispatch:
  push:
    branches: [feature/earthquaker-devices]
    paths:
      - scripts/sync-earthquaker.py
      - .github/workflows/sync-earthquaker.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Research EarthQuaker catalog
        run: python scripts/sync-earthquaker.py
      - name: Commit generated research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earthquaker-enriched.generated.json
          git diff --cached --quiet || git commit -m "Generate EarthQuaker research data"
          git push
