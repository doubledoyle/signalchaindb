name: QA product images
on:
  push:
    branches: [fix/image-qa-bad-batch]
    paths:
      - scripts/qa-image-candidates.mjs
      - .github/workflows/qa-product-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan official product pages
        run: node scripts/qa-image-candidates.mjs
      - name: Commit candidate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/image-qa-candidates.json
          git diff --cached --quiet || git commit -m "Generate targeted image QA report"
          git push
